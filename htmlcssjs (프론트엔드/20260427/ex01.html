<body>
    <style>

        }
    </style>
    <div class="header">

        <div class="nav">
            <ul>
                <li><a href="#" home>home</a></li>
                <li><a href="#" home>about</a></li>
                <li><a href="#" home>service</a></li>
                <li><a href="#" home>contact</a></li>
            </ul>
        </div>

    <style></style>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        .header {
            margin: 0 auto;
            width: 1000px;
            background-color: rgb(200, 250, 200);
            display: flex;
            justify-content: space-between;
        }

        .nav>ul {
            display: flex;
        }

        .nav>ul>li {
            list-style: none;
        }

        .nav ul li a {
            color: black;
            padding: 20px 20px;
            text-decoration: none;
            font-size: 20px;
            line-height: 40px;
        }
    </style>
    <div class="content">
        <h1>content</h1>
        <section class="main-slider">
            <div class="slider">
                <div class="slider-item1 item1">
                    <h1>111111</h1>
                </div>
                <div class="slider-item2 item2">
                    <h1>222222</h1>
                </div>
                <div class="slider-item3 item3">
                    <h1>333333</h1>
                </div>
            </div>
        </section>
    </div>
    <script>
        $(document).ready(function () {
            $('.slider').slick({
                autoplay: true, // 자동 재생
                autoplaySpeed: 3000, // 3초마다 전환
                dots: true, // 하단 네비게이션 점 표시
                arrows: true, // 좌우 화살표 표시
                infinite: true, // 무한 반복
                fade: true, // 페이드 효과 (선택사항)
                cssEase: 'linear'
            });
        });
    </script>
    <div class="footer">
        <h1>footer</h1>
    </div>
</body>
