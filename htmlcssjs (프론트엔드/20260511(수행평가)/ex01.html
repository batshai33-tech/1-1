<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width='device-width', initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(245, 245, 245);
            font-family: "Noto sans KR" sans-serif;
        }

        h1 {
            color: rgb(50, 50, 50)
        }

        .warp {
            /* css 클레스 이름에 영향을 줄땐 (.)점 을 붙여야한다 지금같은경우 클레스 warp 에 영향을 준다 */
            width: 600px;
            /* width 공간 클레스에 공간을 나눈다 "가로를 이야기한다" */
            background-color: white;
            /* 그 공간에 색깔을 말한다 */
            margin: 30px auto;
            /* margin 바깥쪽여백 */
            padding: 20px;
            /*padding 안쪽여백*/
        }

        img {
            width: 100%;
            border-radius: 10px;
            /*border-radius 모서리를 둥글게*/
        }

        .menu_box {
            margin-top: 30px;
            padding: 15px;
            background-color: rgb(235, 242, 255);
            border-radius: 10px;
        }

        .menu_list {
            margin-bottom: 8px;
        }
        input{
            width: 400px;
            height: 34px;
            /*height 세로길이를 이야기한다*/
        }
        button{
            height: 30px;
            background-color: rgb(50, 50, 50);
            color:white;
            border: none;
            /*border 태두리를 이야기한다 none은 없에는것이다*/
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover{
            background-color: rgb(255,120,120);
        }
        .event_box{
            margin-top: 20px; 
            padding: 15px;
            background-color: rgb(255, 241, 210);
            border-radius: 10px;
        }
    </style>
</head>
<!--css---------------------------------------------------------------------->
<body>
    <div class="warp">
        <h1>우리반 간식 소개 & 추천</h1>
        <p>친구들과 먹고싶은간식을 소개하고 추첨하는 웹페이지 입니다</p>
        <img src="snackbar-hero.png" alt="간식 사진" srcset="">
        <div class="menu_box">
            <h2>인기간식!</h2>
            <ul id="menu_list">
                <!-- <li>니얼굴</li>  -->
                <!-- <li>내얼굴</li> -->
                <!-- <li>남의얼굴</li> -->
            </ul>
        </div>
        <div class="menu_box">
            <h2>간식추가!</h2>
            <input
             type="text"
             name="" 
             id="input_snack"
             placeholder="간식을 입력해주세요"
             />
            <button id = "add_btn">추가하기</button>
        </div>
        <div class="menu_box">
            <h2>간식삭제</h2>
            <input 
            type="text"
            name=""
            id="delete_snack"
            placeholder="삭제할 간식을 입력하세요"
            >
            <button id = "delete_btn">삭제하기</button>
        </div>
        <div class="event_box">
            <h3>오늘의 간식!</h3>
            <p id = "event_result">버튼을 누르면 간식이 추천됩니다</p>
            <button id="btn_event">간식추첨</button>
        </div>
    </div>
<!--html-------------------------------------------------------------------------------->
    <script>
        const snacks = ["치즈토스트", "딸기에이드", "초코쿠키", "니얼굴"];

        function renderSnack(snack) {
            const li = document.createElement("li");
            li.textContent = snack;
            document.getElementById('menu_list').appendChild(li);
        }

        function deleteSnack(snack) {
            const list = document.getElementById('menu_list');
            const item = list.getElementsByTagName('li')
            for(let i = 0; i < item.length; i++){
                if(item[i].textContent === snack){
                    list.removeChild(item[i])
                    break
                }
            }

        }
        
        function delete_addSnack(snack){
        for(let i = 0; i < snacks.length;i++){
            if (snack === snacks[i]){
                snacks.splice(i, 1)
                return true
            }
        }
        return false
        }


        function addSnack(snack) {
            if (snack){
                snacks.push(snack)
                return true
            }
        return false
        }

        for (let i = 0; i < snacks.length; i++) {
            renderSnack(snacks[i])
        }
        document.getElementById("add_btn").onclick = function(){
            const input = document.getElementById('input_snack').value;
            if (addSnack(input)){
                renderSnack(input);
            } else {
                alert("간식이름을 입력해주세요");
            } 
            document.getElementById('input_snack').value = "";
            document.getElementById('input_snack').focus();
        }
        document.getElementById("delete_btn").onclick = function(){
            const del = document.getElementById("delete_snack").value;
            if (del === ""){
                alert("삭제할 간식이름을 입력해주세요");
                return;
            }
            if (delete_addSnack(del)){
                deleteSnack(del);
            } else {
                alert(`목록에 "${del}" 은 없습니다`);
            } 
        }
            function getRandomNumber (n){
                return Math.floor(Math.random() * n);
            }

        document.getElementById("btn_event").onclick = function(){
            const num = getRandomNumber(snacks.length);
            document.getElementById("event_result").textContent =
            `오늘의 간식은 ${snacks[num]} 입니다!`
        }
    </script>
</body>

</html>
<!--node.js--------------------------------------------------------------------------
